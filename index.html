<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>ZeepUp</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var requestedCountry = params.get("country");
      var validCountry = requestedCountry === "it" || requestedCountry === "uk";
      var savedCountry = document.cookie.match(/(?:^|;\s*)zeepup_country=(it|uk)(?:;|$)/);
      var destination;

      if (validCountry) {
        destination = requestedCountry;
        document.cookie = "zeepup_country=" + destination + "; Max-Age=31536000; Path=/; SameSite=Lax; Secure";
      } else if (savedCountry) {
        destination = savedCountry[1];
      } else {
        destination = String(navigator.language || "").toLowerCase().indexOf("it") === 0 ? "it" : "uk";
      }

      window.location.replace("/" + destination);
    })();
  </script>
</head>
<body>
  <noscript>
    <nav aria-label="Choose your country">
      <a href="/it">Italia</a> |
      <a href="/uk">UK</a>
    </nav>
  </noscript>
</body>
</html>
