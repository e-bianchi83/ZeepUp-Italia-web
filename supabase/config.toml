[functions.uk-early-signup]
# This endpoint accepts public website submissions. Origin, method, content type,
# body size, honeypot and email validation are enforced inside the function.
verify_jwt = false

[functions.home-chef-registration-alert]
# Only the anonymous applicant session that created a registration may request
# its notification. Legacy gateway verification is disabled because this site
# uses Supabase's current publishable keys; the function validates the user's
# access token and checks row ownership before sending.
verify_jwt = false

[functions.uk-partner-registration]
# Public UK partner-interest submissions are accepted without a Supabase user
# session. The function enforces origin, field, file, size and honeypot checks,
# while all database and storage access remains server-side.
verify_jwt = false
