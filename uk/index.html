<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/Favicon.png">
  <link rel="canonical" href="https://www.zeepup.com/uk">
  <link rel="alternate" hreflang="it-IT" href="https://www.zeepup.com/it">
  <link rel="alternate" hreflang="en-GB" href="https://www.zeepup.com/uk">
  <link rel="alternate" hreflang="x-default" href="https://www.zeepup.com/uk">
  <link rel="stylesheet" href="/assets/css/country-selector.css?v=1">
  <title>ZeepUp UK — Coming soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      max-width: 100%;
      text-align: center;
    }
    p {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(56px, 10vw, 128px);
      line-height: .9;
      letter-spacing: -.065em;
    }
    h1 span { color: #ff0066; }
    @media (max-width: 600px) {
      h1 { font-size: 40px; }
    }
  </style>
</head>
<body>
  <nav class="country-switcher" aria-label="Choose your country">
    <a href="/it" data-country-choice="it">Italy</a>
    <span aria-hidden="true">|</span>
    <a href="/uk" data-country-choice="uk" aria-current="page">UK</a>
  </nav>
  <main>
    <p>ZeepUp UK</p>
    <h1>Coming soon<span>.</span></h1>
  </main>
  <script src="/assets/js/country-selector.js?v=1"></script>
</body>
</html>
